services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # v2: fresh volume initialized from the image dir (owned by appuser).
      # The old sct-data volume was created root-owned by a pre-nonroot image
      # and forced the store into the /tmp fallback (no persistence across
      # container recreation). Old volume is left untouched on the host.
      - sct-data-v2:/app/backend/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  sct-data-v2: