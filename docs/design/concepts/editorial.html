<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маршрутный журнал — Smart Caspian Transit</title>
<link rel="stylesheet" href="fonts.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#eee2ce;color:#402e25;font:16px "IBM Plex Sans",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;margin:0 68px;padding:19px 0;border-bottom:2px solid #584234;font-family:Georgia,serif}
header strong{font-size:24px}
header span{font:14px "JetBrains Mono",monospace}
main{margin:0 68px;display:grid;grid-template-columns:3fr 2fr;gap:32px;min-height:620px;height:calc(100vh - 72px)}
section{display:flex;flex-direction:column;justify-content:space-between;padding:47px 0 36px}
h1{font:normal clamp(67px,9.15vw,138px)/.84 Georgia,serif;letter-spacing:-.084em;margin:22px 0 20px;max-width:7.5ch}
.route-code{display:inline-block;color:#873f2c;border-bottom:1px solid #b98572;font:13px "JetBrains Mono",monospace;padding-bottom:8px}
.deck{max-width:44ch;line-height:1.55;font-size:19px;margin:0 0 15px}
.cta{color:#873f2c;font-weight:750;text-decoration:underline;text-underline-offset:5px}
figure{margin:26px 0 36px;padding:8px 0 0;border-top:1px solid #977b62;border-bottom:1px solid #977b62;display:grid;grid-template-rows:1fr auto}
.map{display:grid;place-items:center;--grid:#d9c6ac;min-height:0}
.map svg{width:100%;height:100%;max-height:515px;overflow:visible}
.sea{fill:#a0b4a5;stroke:#466955;stroke-width:1.6}
.route{fill:none;stroke:#873f2c;stroke-width:2.8;stroke-dasharray:6 4}
.port{fill:#402e25;font:11px "JetBrains Mono",monospace}
.port circle{fill:#873f2c;stroke:#eee2ce;stroke-width:1.8}
figcaption{font:12px "JetBrains Mono",monospace;padding:12px 0}
</style>
</head>
<body>
<header><strong data-copy="brand"></strong><span data-copy="status"></span></header>
<main>
  <section><div><span class="route-code" data-copy="route"></span><h1 data-copy="heading"></h1></div><div><p class="deck" data-copy="description"></p><span class="cta" data-copy="action"></span></div></section>
  <figure><div class="map" data-map></div><figcaption data-copy="route"></figcaption></figure>
</main>
<script src="shared.js"></script>
</body>
</html>
