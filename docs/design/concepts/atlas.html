<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ночной атлас — Smart Caspian Transit</title>
<link rel="stylesheet" href="fonts.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#07131b;color:#eef4ef;font:17px "IBM Plex Sans",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:26px 52px;border-bottom:1px solid #233841}
header img{width:30px;height:30px}
.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:650}
.mode,.route-code{font:13px "JetBrains Mono",monospace;color:#a9c2c3}
main{height:calc(100vh - 84px);min-height:620px;display:grid;grid-template-columns:5fr 7fr;align-items:center;padding:0 52px;isolation:isolate;background:radial-gradient(ellipse at 75% 52%,#122e39 0%,transparent 50%)}
section{position:relative;z-index:1}
h1{font-size:clamp(60px,7.4vw,112px);line-height:.94;letter-spacing:-.073em;margin:18px 0 24px;max-width:7ch}
p{color:#b2c4c5;line-height:1.55;max-width:31ch}
.cta{display:inline-block;background:#8be3c3;color:#09231e;padding:15px 22px;font-weight:750;margin-top:13px}
figure{margin:0;position:relative;height:90%;min-height:480px;display:grid;place-items:center}
.map{width:min(100%,640px);height:100%;display:grid;place-items:center;--grid:#28434d}
.map svg{width:100%;height:100%;max-height:580px;overflow:visible}
.sea{fill:#183e50;stroke:#b6c9b6;stroke-width:1.6}
.route{fill:none;stroke:#8be3c3;stroke-width:2.4;stroke-dasharray:6 4}
.port{fill:#e4efe4;font:10px "JetBrains Mono",monospace}
.port circle{fill:#ff784f;stroke:#07131b;stroke-width:2}
figcaption{position:absolute;right:12px;bottom:12px;padding:12px 15px;border:1px solid #45616a;background:#07131b;font:12px "JetBrains Mono",monospace}
</style>
</head>
<body>
<header><div class="brand"><img src="../../../backend/app/static/assets/brand/mark.svg" alt=""><span data-copy="brand"></span></div><span class="mode" data-copy="status"></span></header>
<main>
  <section><span class="route-code" data-copy="route"></span><h1 data-copy="heading"></h1><p data-copy="description"></p><span class="cta" data-copy="action"></span></section>
  <figure><div class="map" data-map></div><figcaption data-copy="route"></figcaption></figure>
</main>
<script src="shared.js"></script>
</body>
</html>
